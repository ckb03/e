[project]
name = "role-confusion-eval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.12.0",
    "blobfile==3.1.0",
    "compressed-tensors==0.13.0",
    "datasets==4.4.1",
    "flash-attn",
    "kernels==0.11.5",
    "pandas==2.3.3",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "tiktoken==0.12.0",
    "torch==2.9.1",
    "tqdm==4.67.1",
    "transformers==4.57.5",
    "zstandard==0.23.0",
]
[project.scripts]
role-confusion-eval = "eval_harness.cli:main"
[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.5.4/flash_attn-2.8.3+cu128torch2.9-cp312-cp312-linux_x86_64.whl" }
torch = { index = "pytorch-cu128" }
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["eval_harness*"]
