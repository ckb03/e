<text x="800" y="830" text-anchor="middle" font-size="21" font-weight="bold">Why seeds are outside the funnel: merging adds context, so coverage expands from about 4% of raw seed tokens to about 21-23%.</text>
<text x="800" y="855" text-anchor="middle" font-size="19">The later stages are nested reductions: structural filtering, Top-K selection, and LLM-judge confirmation.</text>
